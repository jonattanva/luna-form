name: Build and test

on:
  push:
    branches: [main]
    # A change that only touches documentation, the audit registry, plans or
    # agent instructions runs no code, so it runs no checks. A change that
    # also touches code runs everything. The docs ship in the package, but no
    # test or build step reads them.
    paths-ignore: &docs-only
      - '**/*.md'
      - 'LICENSE'
      - 'audit/**'
      - 'plan/**'
      - '.claude/**'
      - '.agents/**'
      - '.vscode/**'
  pull_request:
    types: [opened, synchronize]
    paths-ignore: *docs-only

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle-size:
    name: bundle-size
    timeout-minutes: 5
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true
      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Cache turbo build setup
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - name: Build project
        run: pnpm build
      - name: Check bundle size
        run: |
          DIST="packages/luna-react/dist"
          ESM="$DIST/client/esm"
          # Three budgets, each for what it guards. Each leaves room for the
          # library to grow by a few changes, so a budget that fails says
          # something unexpected was added, not that the margin ran out.
          #
          # The total of every file guards against a dependency bundled by
          # mistake, which adds hundreds of kB (date-fns took it to 342 kB).
          # Peer dependencies are external, so the total is the library's
          # own code over cjs and esm, every entry: 420.1 kB, the agent
          # tools included, which cjs carries inline because it does not
          # split.
          #
          # The main path is what every application loads from the client
          # entry in esm, compressed: the entry and the chunks it imports.
          # 31.0 kB gzip: the fields' handles, `listTools()`, `callTool()`
          # and what a form records of its submissions are here, and
          # splitting the tools off costs about 0.8 kB of names shared
          # between the chunks. It is the most an application loads from the
          # entry, and close to what it loads whatever it imports: the entry
          # and its shared chunk come in whole.
          #
          # The tools chunk is what loads only when an agent asks for a
          # form's tools: 14.0 kB gzip, the tools, their host and the schema.
          # No application pays for it until an agent is on the page.
          TOTAL_KB=450
          MAIN_GZIP_KB=33
          TOOLS_GZIP_KB=15
          total=0
          rows=""

          while IFS= read -r -d '' f; do
            size=$(wc -c < "$f")
            size_kb=$(awk "BEGIN {printf \"%.1f\", $size/1024}")
            rel="${f#$DIST/}"
            total=$((total + size))
            rows="${rows}| \`${rel}\` | ${size_kb} kB |
          "
          done < <(find "$DIST" -name "*.js" -print0 | sort -z)

          # The entry and the chunks it imports, which is all an application
          # loads before an agent asks; the build empties dist first, so one
          # tools chunk is there.
          main_files=("$ESM/index.js")
          while IFS= read -r chunk; do
            main_files+=("$ESM/$chunk")
          done < <(grep -o 'from"\./chunk-[A-Za-z0-9]*\.js"' "$ESM/index.js" | sed 's/^from"\.\///; s/"$//' | sort -u)
          tools_files=("$ESM"/agent-host-*.js)
          if [ "${#tools_files[@]}" -ne 1 ] || [ ! -f "${tools_files[0]}" ]; then
            echo "Expected one agent tools chunk in $ESM: ${tools_files[*]}" >&2
            exit 1
          fi
          main=$(cat "${main_files[@]}" | gzip -c | wc -c)
          tools=$(gzip -c "${tools_files[0]}" | wc -c)

          kb() { awk "BEGIN {printf \"%.1f\", $1/1024}"; }
          total_kb=$(kb "$total")
          main_kb=$(kb "$main")
          tools_kb=$(kb "$tools")

          {
            echo "<!-- bundle-size-report -->"
            echo "## Bundle size report (react-luna-form)"
            echo ""
            echo "| File | Size |"
            echo "|---|---|"
            echo "$rows"
            echo "| Budget | Size | Limit |"
            echo "|---|---|---|"
            echo "| Total, every file | ${total_kb} kB | ${TOTAL_KB} kB |"
            echo "| Main path, esm, gzip | ${main_kb} kB | ${MAIN_GZIP_KB} kB |"
            echo "| Agent tools chunk, esm, gzip | ${tools_kb} kB | ${TOOLS_GZIP_KB} kB |"
          } > bundle-size-report.md

          cat bundle-size-report.md

          failed=0
          over() {
            if [ "$2" -gt $(($3 * 1024)) ]; then
              echo "$1: $(kb "$2") kB exceeds the limit of $3 kB" >&2
              failed=1
            fi
          }
          over "Total" "$total" "$TOTAL_KB"
          over "Main path (gzip)" "$main" "$MAIN_GZIP_KB"
          over "Agent tools chunk (gzip)" "$tools" "$TOOLS_GZIP_KB"
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "Within every budget: total ${total_kb} kB, main ${main_kb} kB gzip, tools ${tools_kb} kB gzip"
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        # The size gate is the step above, which exits non-zero on its own.
        # This one only publishes the report, so a failed API write must not
        # turn a passing build red: the comment is a courtesy, not a check.
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const body = fs.readFileSync('bundle-size-report.md', 'utf8')
            const marker = '<!-- bundle-size-report -->'

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })

            const existing = comments.find(c => c.body.includes(marker))

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }
  build:
    name: build
    timeout-minutes: 5
    runs-on: ubuntu-26.04
    outputs:
      playwright: ${{ steps.playwright-version.outputs.version }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          cache: true
      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Cache turbo build setup
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - name: Build project
        run: pnpm build
      # The version the e2e tests run in the Playwright image of, which has to
      # be the one the lockfile installs.
      - name: Get Playwright version
        id: playwright-version
        run: |
          echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> $GITHUB_OUTPUT
  lint:
    name: lint
    timeout-minutes: 5
    runs-on: ubuntu-26.04
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          cache: true
      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Cache turbo build setup
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      # Formatting and unused code first: they need no build and take a few
      # seconds each. knip gives the same answer with or without
      # `luna-core/dist` (its tsconfig names `outDir`, which knip maps back to
      # the sources), so the order of these steps does not change its result.
      - name: Check formatting
        run: pnpm prettier:check
      - name: Check unused code
        run: pnpm knip
      - name: Lint project
        run: pnpm run lint
      - name: Run TypeScript checks
        run: pnpm run typescript
  unit-test:
    name: unit-test
    timeout-minutes: 5
    runs-on: ubuntu-26.04
    needs: build
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          cache: true
      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Run unit tests
        run: pnpm test:unit
  e2e-test:
    name: e2e-test (${{ matrix.browser }}, ${{ matrix.shard }}/${{ matrix.shards }})
    timeout-minutes: 30
    runs-on: ubuntu-26.04
    needs: build
    # In the Playwright image, which carries the browsers and the system
    # packages they need. Installing those packages on the runner took up to
    # 27 minutes on a slow apt mirror, enough to cancel a webkit job before
    # its tests ran. The runner's user, so Firefox does not run as root.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.build.outputs.playwright }}-resolute
      options: --user 1001
    strategy:
      fail-fast: false
      # Firefox and WebKit run against production (`next start`), as the
      # Next.js testing guide recommends, in three shards each: they are the
      # slowest browsers, and production takes a fifth off their run. Chromium
      # stays on `next dev`, so StrictMode's doubled renders and effects are
      # still exercised end to end. Measured over six runs each in
      # test-audit-2026-11-19 (OPT-01, OPT-03): the verdict went from 822 s to
      # 584 s, with no case passing only on retry.
      matrix:
        include:
          - { browser: chromium, server: serve, shard: 1, shards: 2 }
          - { browser: chromium, server: serve, shard: 2, shards: 2 }
          - { browser: firefox, server: start, shard: 1, shards: 3 }
          - { browser: firefox, server: start, shard: 2, shards: 3 }
          - { browser: firefox, server: start, shard: 3, shards: 3 }
          - { browser: webkit, server: start, shard: 1, shards: 3 }
          - { browser: webkit, server: start, shard: 2, shards: 3 }
          - { browser: webkit, server: start, shard: 3, shards: 3 }
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          cache: true
      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Cache turbo build setup
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - name: Build project
        run: pnpm build
      # The server writes to a file. Left on the step's output, it blocks once
      # that step has ended and nobody reads the pipe, and every test after
      # that times out.
      - name: Start application server
        run: |
          pnpm ${{ matrix.server }} > server.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -sf http://localhost:3000 > /dev/null && exit 0
            sleep 1
          done
          echo "The application server did not answer on port 3000" >&2
          exit 1
      - name: Run e2e tests
        # Chromium also runs the WebMCP project, the same browser with the flag on.
        # The JSON report goes next to the blob, in the same artifact: its name
        # says which shard ran it, which the merged report no longer knows, and
        # `e2e-report` reads the flaky cases from it.
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: blob-report/results-${{ matrix.browser }}-${{ matrix.shard }}of${{ matrix.shards }}.json
        run: pnpm test:e2e --project=${{ matrix.browser }} ${{ matrix.browser == 'chromium' && '--project=chromium-webmcp' || '' }} --shard=${{ matrix.shard }}/${{ matrix.shards }} --reporter=blob,json
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: server-log-${{ matrix.browser }}-${{ matrix.shard }}
          path: server.log
          retention-days: 1
  e2e-report:
    name: e2e-report
    timeout-minutes: 5
    runs-on: ubuntu-26.04
    needs: e2e-test
    if: ${{ !cancelled() && needs.e2e-test.result != 'skipped' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          cache: true
      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Download blob reports
        uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge into one HTML report
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v7
        with:
          name: playwright-report-e2e
          path: playwright-report/
          retention-days: 1
      # A case that fails and then passes on retry leaves the run green, so it
      # is listed here, on the run's summary, and as a warning annotation on
      # its line, which the pull request shows. It does not fail the run: the
      # retries are there so that one hiccup of a runner does not block an
      # unrelated change. It runs when shards failed, and reads only the
      # shards that reported; a shard that never ran tests is red on its own.
      - name: Report flaky cases
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob
          files=(all-blob-reports/results-*.json)
          summary() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          summary "## E2E flaky cases"
          summary ""
          if [ "${#files[@]}" -eq 0 ]; then
            summary "No shard reported e2e results."
            exit 0
          fi

          # Every spec under a file, with the titles of the describe blocks
          # it sits in, and the shard from the report's name.
          cases='
            def specs($path):
              (.specs[]? | . as $spec | .tests[] | {
                title: ($path + [$spec.title] | join(" > ")),
                file: ("tests/e2e/" + $spec.file),
                line: $spec.line,
                project: .projectName,
                status,
                attempts: (.results | length)
              }),
              (.suites[]? as $suite | $suite | specs($path + [$suite.title]));
            (input_filename | capture("results-[a-z]+-(?<shard>[0-9]+of[0-9]+)\\.json$").shard | sub("of"; "/")) as $shard
            | .suites[] | specs([]) | select(.status == "flaky") | . + { shard: $shard }'
          flaky=$(jq -c "$cases" "${files[@]}")
          count=$(printf '%s' "$flaky" | grep -c . || true)
          jq -s -r 'map(.stats) | "\(map(.expected) | add) passed, \(map(.flaky) | add) flaky, \(map(.unexpected) | add) failed, \(map(.skipped) | add) skipped, in \(length) shard reports."' "${files[@]}" >> "$GITHUB_STEP_SUMMARY"
          summary ""
          if [ "$count" -eq 0 ]; then
            summary "No case passed only on retry."
            exit 0
          fi

          summary "Cases that failed and then passed on retry: $count"
          summary ""
          summary "| Project | Shard | Case | Attempts |"
          summary "|---|---|---|---|"
          printf '%s\n' "$flaky" | jq -r '"| \(.project) | \(.shard) | `\(.file):\(.line)` \(.title | gsub("\\|"; "\\|")) | \(.attempts) |"' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$flaky" | jq -r 'def esc: gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
            "::warning file=\(.file),line=\(.line),title=Flaky e2e case::\("\(.project), shard \(.shard): \(.title) passed after \(.attempts) attempts" | esc)"'
  render-budget:
    name: render-budget
    timeout-minutes: 20
    runs-on: ubuntu-26.04
    needs: build
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          cache: true
      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      # The budgets read what the probes write, so the probes go in before the
      # build. `--strict` stops here when an anchor has moved, instead of
      # letting a budget pass on a zero that measured nothing.
      - name: Apply render probes
        run: pnpm benchmark:probes --strict
      - name: Build project
        run: pnpm build
      - name: Get Playwright version
        id: playwright-version
        run: |
          echo "version=$(pnpm list @playwright/test --depth=0 --json | jq -r '.[0].devDependencies["@playwright/test"].version')" >> $GITHUB_OUTPUT
          echo "image=$(. /etc/os-release && echo "$ID-$VERSION_ID")" >> $GITHUB_OUTPUT
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-version.outputs.image }}-playwright-chromium-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium
      # Production, not `pnpm serve`: development StrictMode doubles the
      # render and schema counts the budgets are written in.
      - name: Start production server
        run: |
          pnpm start &
          for attempt in $(seq 1 60); do
            curl -sf http://localhost:3000 > /dev/null && exit 0
            sleep 1
          done
          echo "The production server did not answer on port 3000" >&2
          exit 1
      - name: Run render budgets
        run: pnpm test:render
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-render
          path: playwright-report/
          retention-days: 1
